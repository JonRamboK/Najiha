<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Najiha — About Us</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="najiha.css" />

  <style>
    .about-hero {
      padding: 140px 5% 80px;
      background: linear-gradient(135deg, #1c1c1e 55%, #2d1a2e);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .about-hero::before {
      content: ''; position: absolute; left: 50%; top: -80px;
      transform: translateX(-50%);
      width: 500px; height: 500px; border-radius: 50%;
      background: rgba(232,100,122,0.06);
    }
    .about-hero h1 { font-family: var(--font-display); font-size: clamp(36px,5vw,60px); color: var(--white); margin: 12px 0 16px; position: relative; }
    .about-hero p  { color: rgba(255,255,255,0.6); max-width: 560px; margin: 0 auto; font-size: 16px; line-height: 1.8; position: relative; }

    .story-section {
      max-width: 900px; margin: 0 auto;
      padding: var(--section-y) var(--pad-x);
      text-align: center;
    }
    .story-section p { color: var(--ink-soft); font-size: 16px; line-height: 1.9; margin-bottom: 1.5rem; }

    .stats-strip {
      background: var(--rose);
      padding: 48px 5%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      max-width: 1000px;
      margin: 0 auto;
      border-radius: var(--r-xl);
      text-align: center;
    }
    .stat-item .n { font-family: var(--font-display); font-size: clamp(28px,4vw,42px); color: var(--white); font-weight: 700; }
    .stat-item .l { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.8); margin-top: 6px; }

    .values-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .value-card {
      background: var(--white);
      border-radius: var(--r-lg);
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    }
    .value-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
    .value-icon { font-size: 34px; margin-bottom: 1rem; }
    .value-card h4 { font-family: var(--font-display); font-size: 19px; color: var(--ink); margin-bottom: 8px; }
    .value-card p  { font-size: 13px; color: var(--gray-mid); line-height: 1.7; }

    @media (max-width: 900px) {
      .stats-strip { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
      .values-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .about-hero { padding: 110px 5% 56px; }
      .values-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="nav-mount"></div>

  <section class="about-hero" id="about-hero"></section>

  <section class="story-section" id="about-story"></section>

  <section class="section-sm">
    <div class="stats-strip" id="about-stats"></div>
  </section>

  <section class="section section-mist">
    <div class="section-head" style="max-width:1100px;margin:0 auto;">
      <div class="left">
        <span class="label">What We Stand For</span>
        <h2 style="font-family:var(--font-display);font-size:38px;">Our Values</h2>
      </div>
    </div>
    <div class="values-grid" id="about-values"></div>
  </section>

  <section style="background:linear-gradient(135deg,#1c1c1e 50%,#2d1a2e);padding:90px 5%;text-align:center;">
    <span class="label">Join the Family</span>
    <h2 style="font-family:var(--font-display);font-size:clamp(30px,4vw,44px);color:white;margin:12px 0 20px;">Ready to Find Their Next Favorite Outfit?</h2>
    <a href="Store.html" class="btn-primary">Shop the Collection</a>
  </section>

  <div id="contact-mount"></div>
  <div id="newsletter-mount"></div>
  <div id="footer-mount"></div>

  <script src="model.js"></script>
  <script src="activity.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      NajihaActivity.mountNav('About');
      NajihaActivity.mountContact('contact-mount');
      NajihaActivity.mountNewsletter();
      NajihaActivity.mountFooter();
      NajihaActivity.mountSocialFloat();

      const c = NajihaModel.ABOUT_CONTENT;

      document.getElementById('about-hero').innerHTML = `
        <span class="label" style="color:var(--rose-light);">${c.hero.label}</span>
        <h1>${c.hero.title}</h1>
        <p>${c.hero.desc}</p>
      `;

      document.getElementById('about-story').innerHTML = c.story.map(p => `<p>${p}</p>`).join('');

      document.getElementById('about-stats').innerHTML = c.stats.map(s => `
        <div class="stat-item"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>
      `).join('');

      document.getElementById('about-values').innerHTML = c.values.map(v => `
        <div class="value-card fade-up">
          <div class="value-icon">${v.icon}</div>
          <h4>${v.title}</h4>
          <p>${v.desc}</p>
        </div>
      `).join('');
    });
  </script>

</body>
</html>
