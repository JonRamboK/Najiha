<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Najiha — Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="najiha.css" />

  <style>
    .gallery-hero {
      padding: 128px 5% 40px;
      text-align: center;
      background: var(--mist);
    }
    .gallery-hero h1 { font-family: var(--font-display); font-size: clamp(34px,5vw,56px); margin: 10px 0 12px; }
    .gallery-hero p  { color: var(--gray-mid); max-width: 520px; margin: 0 auto; font-size: 15px; line-height: 1.7; }

    .gallery-wrap { max-width: 1200px; margin: 0 auto; padding: var(--section-y) var(--pad-x); }

    .gallery-grid {
      columns: 4 220px;
      column-gap: 1rem;
    }
    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      border-radius: var(--r-lg);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: var(--mist);
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    }
    .gallery-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .gallery-item img {
      width: 100%; display: block;
      transition: transform 0.5s var(--ease);
    }
    .gallery-item:hover img { transform: scale(1.05); }
    .gallery-caption {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 1.5rem 1rem 0.9rem;
      background: linear-gradient(0deg, rgba(28,28,30,0.8), transparent);
      color: var(--white);
      font-size: 12.5px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.25s var(--ease);
    }
    .gallery-item:hover .gallery-caption { opacity: 1; transform: none; }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(28,28,30,0.92);
      z-index: 1000;
      align-items: center; justify-content: center;
      padding: 2rem;
    }
    .lightbox.open { display: flex; animation: fade-in 0.25s var(--ease); }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .lightbox img { max-width: 90vw; max-height: 82vh; border-radius: var(--r-lg); box-shadow: var(--shadow-lg); }
    .lightbox-caption { color: var(--white); text-align: center; margin-top: 1rem; font-size: 14px; }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: var(--white); font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .lightbox-close:hover { background: var(--rose); border-color: var(--rose); }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: var(--white); font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .lightbox-nav:hover { background: var(--rose); border-color: var(--rose); }
    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }

    @media (max-width: 900px) { .gallery-grid { columns: 3 160px; } }
    @media (max-width: 560px) { .gallery-grid { columns: 2 140px; } .lightbox-nav { display: none; } }
  </style>
</head>
<body>

  <div id="nav-mount"></div>

  <section class="gallery-hero">
    <span class="label">Look Book</span>
    <h1>Our Gallery</h1>
    <p>A closer look at the little details, textures, and colors that make every Najiha piece special.</p>
  </section>

  <div class="gallery-wrap">
    <div class="cat-pills" id="gallery-filter"></div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <div id="newsletter-mount"></div>
  <div id="footer-mount"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lb-prev">‹</button>
    <div>
      <img id="lb-img" src="" alt="" />
      <p class="lightbox-caption" id="lb-caption"></p>
    </div>
    <button class="lightbox-nav lightbox-next" id="lb-next">›</button>
  </div>

  <script src="model.js"></script>
  <script src="activity.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      NajihaActivity.mountNav('Gallery');
      NajihaActivity.mountNewsletter();
      NajihaActivity.mountFooter();
      NajihaActivity.mountSocialFloat();

      const items = NajihaModel.GALLERY_ITEMS;
      const tags  = ['all', ...new Set(items.map(i => i.tag))];
      const grid  = document.getElementById('gallery-grid');
      const filterBar = document.getElementById('gallery-filter');

      filterBar.innerHTML = tags.map(t =>
        `<button class="cat-pill ${t === 'all' ? 'active' : ''}" data-tag="${t}">${t.charAt(0).toUpperCase() + t.slice(1)}</button>`
      ).join('');

      let current = items;

      function render(list) {
        current = list;
        grid.innerHTML = list.map((it, i) => `
          <div class="gallery-item" data-i="${i}">
            <img src="${it.img}" alt="${it.caption}" loading="lazy"
                 onerror="this.closest('.gallery-item').style.background='var(--mist)';this.style.opacity='0';" />
            <div class="gallery-caption">${it.caption}</div>
          </div>
        `).join('');

        grid.querySelectorAll('.gallery-item').forEach(el => {
          el.addEventListener('click', () => openLightbox(Number(el.dataset.i)));
        });
      }
      render(items);

      filterBar.addEventListener('click', e => {
        const pill = e.target.closest('.cat-pill');
        if (!pill) return;
        filterBar.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const tag = pill.dataset.tag;
        render(tag === 'all' ? items : items.filter(i => i.tag === tag));
      });

      /* ── Lightbox logic ── */
      let lbIndex = 0;
      const lightbox   = document.getElementById('lightbox');
      const lbImg      = document.getElementById('lb-img');
      const lbCaption  = document.getElementById('lb-caption');

      function openLightbox(i) {
        lbIndex = i;
        updateLightbox();
        lightbox.classList.add('open');
      }
      function updateLightbox() {
        const item = current[lbIndex];
        lbImg.src = item.img;
        lbImg.alt = item.caption;
        lbCaption.textContent = item.caption;
      }
      document.getElementById('lb-close').addEventListener('click', () => lightbox.classList.remove('open'));
      document.getElementById('lb-prev').addEventListener('click', () => { lbIndex = (lbIndex - 1 + current.length) % current.length; updateLightbox(); });
      document.getElementById('lb-next').addEventListener('click', () => { lbIndex = (lbIndex + 1) % current.length; updateLightbox(); });
      lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('open'); });
      document.addEventListener('keydown', e => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') lightbox.classList.remove('open');
        if (e.key === 'ArrowLeft') document.getElementById('lb-prev').click();
        if (e.key === 'ArrowRight') document.getElementById('lb-next').click();
      });
    });
  </script>

</body>
</html>
