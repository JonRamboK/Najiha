<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najiha | Modern Login</title>
    <link rel="icon" type="image/x-icon" href="https://static.vecteezy.com/system/resources/previews/020/335/987/non_2x/netflix-logo-netflix-icon-free-free-vector.jpg">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Lobster&display=swap" rel="stylesheet">

    <style>
        :root {
            --g-blue: #4285F4; --g-red: #EA4335; --g-yellow: #FBBC05; --g-green: #34A853;
            --accent: #ff4b2b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        .brand {
            font-family: 'Lobster', cursive;
            font-size: 3rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Centered Password Input Styling */
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 15px !important;
            padding: 14px 50px 14px 20px !important; /* Extra padding on right for icon */
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.2) !important;
            background: rgba(255, 255, 255, 0.12) !important;
        }

        /* The Eye Icon - Centered Vertically on the Right */
        .toggle-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            transition: 0.3s;
            z-index: 5;
        }

        .toggle-icon:hover {
            color: var(--accent);
        }

        .btn-submit {
            background: var(--accent);
            border: none;
            border-radius: 15px;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: 0.4s;
            color: white;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 75, 43, 0.4);
        }

        /* Google Dots Loader Overlay */
        .loader-wrap {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            border-radius: 24px;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .dots { display: flex; gap: 8px; }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
            animation: bounce 0.5s infinite alternate;
        }
        .dot:nth-child(1) { background: var(--g-blue); animation-delay: 0s; }
        .dot:nth-child(2) { background: var(--g-red); animation-delay: 0.1s; }
        .dot:nth-child(3) { background: var(--g-yellow); animation-delay: 0.2s; }
        .dot:nth-child(4) { background: var(--g-green); animation-delay: 0.3s; }

        @keyframes bounce { to { transform: translateY(-12px); } }

        .link-switch {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="loader-wrap" id="loader">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <span class="mt-3 small opacity-50">Authenticating...</span>
    </div>

    <div class="brand">Najiha</div>

    <div id="loginFormArea">
        <form id="loginForm">
            <div class="input-box">
                <input type="email" id="lEmail" class="form-control" placeholder="Email" required>
            </div>
            <div class="input-box">
                <input type="password" id="lPass" class="form-control" placeholder="Password" required>
                <i class="bi bi-eye toggle-icon" onclick="toggleView('lPass', this)"></i>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
        <p class="mt-4 small opacity-50">Need an account? <span class="link-switch" onclick="switchTab()">Register</span></p>
    </div>

    <div id="regFormArea" style="display:none;">
        <form id="regForm">
            <div class="input-box">
                <input type="text" id="rName" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="input-box">
                <input type="email" id="rEmail" class="form-control" placeholder="Email" required>
            </div>
            <div class="input-box">
                <input type="password" id="rPass" class="form-control" placeholder="Strong Password" required>
                <i class="bi bi-eye toggle-icon" onclick="toggleView('rPass', this)"></i>
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>
        <p class="mt-4 small opacity-50">Joined already? <span class="link-switch" onclick="switchTab()">Sign In</span></p>
    </div>
</div>

<script>
    const loader = document.getElementById('loader');

    function switchTab() {
        const login = document.getElementById('loginFormArea');
        const reg = document.getElementById('regFormArea');
        login.style.display = login.style.display === 'none' ? 'block' : 'none';
        reg.style.display = reg.style.display === 'none' ? 'block' : 'none';
    }

    // Toggle logic centered in input
    function toggleView(id, icon) {
        const input = document.getElementById(id);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = "password";
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }

    // Storage and Authentication logic
    document.getElementById('regForm').onsubmit = (e) => {
        e.preventDefault();
        const data = { 
            name: document.getElementById('rName').value, 
            email: document.getElementById('rEmail').value, 
            pass: document.getElementById('rPass').value 
        };
        loader.style.display = 'flex';
        setTimeout(() => {
            localStorage.setItem(data.email, JSON.stringify(data));
            loader.style.display = 'none';
            alert("Registered successfully!");
            switchTab();
        }, 1500);
    };

    document.getElementById('loginForm').onsubmit = (e) => {
        e.preventDefault();
        const email = document.getElementById('lEmail').value;
        const pass = document.getElementById('lPass').value;
        loader.style.display = 'flex';
        setTimeout(() => {
            const user = JSON.parse(localStorage.getItem(email));
            loader.style.display = 'none';
            if(user && user.pass === pass) {
                window.location.href = "index.html";
            } else {
                alert("Wrong email or password.");
            }
        }, 1500);
    };
</script>
</body>
</html>
