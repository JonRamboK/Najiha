<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Najiha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; padding-top: 50px; }
        .welcome-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 50px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="welcome-card shadow-lg">
            <h1 class="display-4 fw-bold">Welcome, <span id="userName" class="text-primary">Guest</span>!</h1>
            <p class="lead opacity-75">You have successfully matched your credentials.</p>
            <hr class="bg-secondary my-4">
            <button onclick="logout()" class="btn btn-outline-light px-5">Logout</button>
        </div>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('userData'));
        if (!data) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userName').innerText = data.name;
        }

        function logout() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
