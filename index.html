<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najiha | Login</title>
    <link rel="icon" type="image/x-icon" href="https://static.vecteezy.com/system/resources/previews/020/335/987/non_2x/netflix-logo-netflix-icon-free-free-vector.jpg">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">


    <style>
        :root {
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
            --accent: #ff4b2b;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)), 
                        url('./rambo/photoligin\ back.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* Glassmorphism Container */
        .auth-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .brand-logo {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
            letter-spacing: -1px;
            font-family: "Lobster", sans-serif;
        }
        .brand-logo:hover{
            
            /* transform: translateY(-2px); */
            /* box-shadow: 0 20px 10px rgba(255, 75, 43, 0.4); */
            cursor: pointer;
        }

        /* Forms */
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 12px;
            padding: 12px 15px;
            transition: 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.267);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.3);
        }

        .btn-najiha {
            background: var(--accent);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: 0.4s;
            color: white;
            margin-top: 15px;
            
        }

        .btn-najiha:hover {
            background: #ff416c;
            transform: translateY(-2px);
            box-shadow: 0 20px 10px rgba(255, 75, 43, 0.4);
        }

        /* Loading & Messages */
        .loader-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Beautiful Center Alert */
        #customAlert {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            width: 320px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -60%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        .dot-loader { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; animation: bounce 0.2s infinite alternate; }
        .dot:nth-child(1) { background: var(--google-blue); animation-delay: 0s; }
        .dot:nth-child(2) { background: var(--google-red); animation-delay: 0.2s; }
        .dot:nth-child(3) { background: var(--google-yellow); animation-delay: 0.4s; }

        @keyframes bounce { to { transform: translateY(-10px); } }

        .switch-link { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

<!-- Custom Alert Pop-up -->
<div id="customAlert">
    <div id="alertIcon" class="mb-2" style="font-size: 2rem;"></div>
    <h5 id="alertTitle">Notification</h5>
    <p id="alertMsg" class="small text-muted"></p>
    <button class="btn btn-dark btn-sm w-100 rounded-pill" onclick="closeAlert()">Continue</button>
</div>

<div class="auth-container">
    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="dot-loader">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <p class="mt-3 small">Processing...</p>
    </div>

    <a href="#" class="brand-logo">Najiha</a>

    <!-- Login Section -->
    <div id="loginSection">
        <h5 class="text-center mb-4 opacity-75">Welcome Back</h5>
        <form id="loginForm">
            <div class="mb-3">
                <input type="email" id="lEmail" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
                <input type="password" id="lPass" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-najiha w-100">Sign In</button>
        </form>
        <p class="text-center mt-4 small">New here? <span class="switch-link" onclick="toggleAuth()">Create Account</span></p>
    </div>

    <!-- Register Section -->
    <div id="registerSection" style="display: none;">
        <h5 class="text-center mb-4 opacity-75">Join Us</h5>
        <form id="registerForm">
            <div class="mb-3">
                <input type="text" id="rName" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="mb-3">
                <input type="email" id="rEmail" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
                <input type="password" id="rPass" class="form-control" placeholder="Create Strong Password" required>
                <div class="form-text text-white-50" style="font-size: 0.65rem;">
                    Min. 8 chars, 1 Uppercase, 1 Number.
                </div>
            </div>
            <button type="submit" class="btn btn-najiha w-100">Register</button>
        </form>
        <p class="text-center mt-4 small">Already a member? <span class="switch-link" onclick="toggleAuth()">Sign In</span></p>
    </div>
</div>

<script>
    const loader = document.getElementById('loader');
    const customAlert = document.getElementById('customAlert');

    // UI Toggle
    function toggleAuth() {
        const lSec = document.getElementById('loginSection');
        const rSec = document.getElementById('registerSection');
        lSec.style.display = lSec.style.display === "none" ? "block" : "none";
        rSec.style.display = rSec.style.display === "none" ? "block" : "none";
    }

    // Beautiful Alert Function
    function showAlert(title, msg, type = 'success') {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMsg').innerText = msg;
        document.getElementById('alertIcon').innerHTML = type === 'success' ? '✅' : '❌';
        customAlert.style.display = 'block';
    }

    function closeAlert() {
        customAlert.style.display = 'none';
    }

    // Password Validation (Regex)
    function isStrong(pw) {
        return /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}/.test(pw);
    }

    // Handle Registration
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('rName').value;
        const email = document.getElementById('rEmail').value;
        const pass = document.getElementById('rPass').value;

        if (!isStrong(pass)) {
            showAlert("Weak Password", "Password must be at least 8 chars with Uppercase and Numbers.", "error");
            return;
        }

        loader.style.display = 'flex';
        
        setTimeout(() => {
            // Save to localStorage
            const userData = { name, email, pass };
            localStorage.setItem(email, JSON.stringify(userData));
            
            loader.style.display = 'none';
            showAlert("Success!", "Account created. You can now login.");
            toggleAuth();
        }, 1500);
    });

    // Handle Login
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('lEmail').value;
        const pass = document.getElementById('lPass').value;

        loader.style.display = 'flex';

        setTimeout(() => {
            const storedData = localStorage.getItem(email);
            loader.style.display = 'none';

            if (storedData) {
                const user = JSON.parse(storedData);
                if (user.pass === pass) {
                    showAlert("Welcome!", `Hello ${user.name}, redirecting...`);
                    setTimeout(() => { window.location.href = "Home.html"; }, 2000);
                } else {
                    showAlert("Error", "Incorrect password. Please try again.", "error");
                }
            } else {
                showAlert("Not Found", "No account found with this email.", "error");
            }
        }, 1500);
    });
</script>

</body>
</html>
