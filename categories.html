<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browse Najiha Closet by category — baby, girls, boys, party wear, Eid collection and custom size.">
<title>Categories | Najiha Closet</title>
<link rel="icon" href="assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/extra.css">
</head>
<body>

<script src="js/loader.js"></script>
<div id="site-navbar"></div>

<main id="main">
  <section class="section-tight">
    <div class="section-head" style="margin-bottom:6px;">
      <div>
        <span class="section-eyebrow">Browse</span>
        <h2>Shop by category</h2>
        <p>Find exactly what you're looking for — from newborn essentials to Eid-ready party wear.</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:10px;">
    <div class="product-grid" style="grid-template-columns:repeat(3,1fr);" id="categoryTiles"></div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/firebase-core.js"></script>
<script type="module" src="js/cart.js"></script>
<script type="module" src="js/navbar.js"></script>
<script type="module" src="js/footer.js"></script>
<script type="module">
import { hideLoadScreen, initFloatingButtons, initRevealOnScroll } from './js/ui.js';
import { getAllProducts } from './js/products.js';

const TILES = [
  { key: 'baby', label: 'Baby Collection', desc: 'Soft, breathable pieces for newborns to toddlers.', img: 'https://picsum.photos/seed/nc-page-baby/500/500' },
  { key: 'girls', label: "Girls' Collection", desc: 'Dresses, sets and party-ready styles.', img: 'https://picsum.photos/seed/nc-page-girls/500/500' },
  { key: 'boys', label: "Boys' Collection", desc: 'Casual sets, kurtas and formal wear.', img: 'https://picsum.photos/seed/nc-page-boys/500/500' },
  { key: 'girls', occasion: 'Party Wear', label: 'Party Wear', desc: 'Occasion-ready frocks and gowns.', img: 'https://picsum.photos/seed/nc-page-party/500/500' },
  { key: 'all', occasion: 'Eid Collection', label: 'Eid Collection', desc: 'Festive kurtas, kurta sets and dresses.', img: 'https://picsum.photos/seed/nc-page-eid/500/500' },
  { key: 'all', custom: true, label: 'Custom Collection', desc: 'Made to your child\'s exact measurements.', img: 'https://picsum.photos/seed/nc-page-custom/500/500' },
];

function count(tile) {
  const all = getAllProducts();
  return all.filter(p =>
    (tile.key === 'all' || p.category === tile.key) &&
    (!tile.occasion || p.occasion === tile.occasion) &&
    (!tile.custom || p.customSize)
  ).length;
}

document.getElementById('categoryTiles').innerHTML = TILES.map(t => {
  const params = new URLSearchParams();
  if (t.key !== 'all') params.set('category', t.key);
  if (t.occasion) params.set('occasion', t.occasion);
  if (t.custom) params.set('custom', '1');
  return `
    <a class="product-card" href="shop.html?${params.toString()}" style="text-decoration:none;">
      <div class="product-thumb"><img src="${t.img}" alt="${t.label}" loading="lazy"></div>
      <div class="product-info">
        <h3 class="product-name">${t.label}</h3>
        <p style="margin:0;">${t.desc}</p>
        <span class="stock-note">${count(t)} products</span>
      </div>
    </a>`;
}).join('');

hideLoadScreen();
initFloatingButtons();
initRevealOnScroll();
</script>
</body>
</html>
