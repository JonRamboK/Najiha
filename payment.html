<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Najiha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="najiha.css" />

  <style>
    /* ── Checkout page styles ── */
    .checkout-page {
      padding-top: 88px;
      min-height: 100vh;
      background: var(--cream);
    }

    .checkout-container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 40px 5% 80px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2.5rem;
      align-items: start;
    }

    /* ── Section headings ── */
    .checkout-heading {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--ink);
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Panel / Card ── */
    .checkout-panel {
      background: var(--white);
      border-radius: var(--r-lg);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
    }

    /* ── Form Fields ── */
    .field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .field-group  { margin-bottom: 16px; }
    .field-label  {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 7px;
    }
    .field-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(232,100,122,0.1);
    }
    .field-input::placeholder { color: var(--gray-mid); }

    /* ── Payment Methods ── */
    .pay-methods { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .pay-method {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .pay-method:hover        { border-color: var(--rose); }
    .pay-method.selected     { border-color: var(--rose); background: var(--rose-light); }
    .pay-method input[type="radio"] { accent-color: var(--rose); transform: scale(1.2); }
    .pay-method-icon  { font-size: 22px; }
    .pay-method-label { font-size: 14px; font-weight: 500; color: var(--ink); }

    /* Card fields panel */
    .card-fields { display: none; }
    .card-fields.visible { display: block; animation: fade-up 0.25s var(--ease); }

    /* ── Order Summary ── */
    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .order-item:last-child { border-bottom: none; }
    .order-item-name { font-size: 14px; font-weight: 500; color: var(--ink); }
    .order-item-meta { font-size: 12px; color: var(--gray-mid); margin-top: 2px; }
    .order-item-price { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }

    .order-summary-line {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
      color: var(--gray-mid);
    }
    .order-total {
      display: flex;
      justify-content: space-between;
      padding: 14px 0 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      border-top: 1.5px solid var(--border);
      margin-top: 8px;
    }

    /* Promo code */
    .promo-row {
      display: flex;
      gap: 8px;
      margin: 14px 0;
    }
    .promo-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-pill);
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }
    .promo-row input:focus { border-color: var(--rose); }
    .promo-row button {
      padding: 10px 20px;
      background: var(--ink);
      color: var(--white);
      border: none;
      border-radius: var(--r-pill);
      font-size: 13px;
      font-family: var(--font-body);
      cursor: pointer;
      transition: background 0.2s;
    }
    .promo-row button:hover { background: var(--rose); }

    /* Pay button */
    .btn-pay {
      width: 100%;
      padding: 15px;
      background: var(--rose);
      color: var(--white);
      border: none;
      border-radius: var(--r-pill);
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .btn-pay:hover {
      background: var(--rose-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(232,100,122,0.3);
    }

    /* Security badge */
    .secure-note {
      text-align: center;
      font-size: 12px;
      color: var(--gray-mid);
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ── Success Overlay ── */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .success-overlay.open { display: flex; animation: fade-in .25s var(--ease); }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .success-card {
      background: var(--white);
      border-radius: var(--r-xl);
      padding: 3rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fade-up .35s var(--ease-bounce);
    }
    .success-icon { font-size: 56px; margin-bottom: 1rem; }
    .success-card h2 { font-family: var(--font-display); font-size: 30px; margin-bottom: 8px; }
    .success-card p  { color: var(--gray-mid); font-size: 14px; margin-bottom: 2rem; line-height: 1.7; }

    @media (max-width: 860px) {
      .checkout-container { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .field-grid-2 { grid-template-columns: 1fr; }
      .field-grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Navigation -->
<div id="nav-mount"></div>

<main class="checkout-page">
  <div class="checkout-container">

    <!-- ── LEFT: Forms ── -->
    <div>

      <!-- Shipping Info -->
      <div class="checkout-panel">
        <h2 class="checkout-heading">Shipping Details</h2>
        <div class="field-grid-2">
          <div class="field-group">
            <label class="field-label" for="s-first">First Name</label>
            <input class="field-input" type="text" id="s-first" placeholder="Aisha" autocomplete="given-name" />
          </div>
          <div class="field-group">
            <label class="field-label" for="s-last">Last Name</label>
            <input class="field-input" type="text" id="s-last" placeholder="Khan" autocomplete="family-name" />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="s-email">Email Address</label>
          <input class="field-input" type="email" id="s-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field-group">
          <label class="field-label" for="s-phone">Phone Number</label>
          <input class="field-input" type="tel" id="s-phone" placeholder="+92 300 0000000" autocomplete="tel" />
        </div>
        <div class="field-group">
          <label class="field-label" for="s-address">Street Address</label>
          <input class="field-input" type="text" id="s-address" placeholder="123 Main Street" autocomplete="street-address" />
        </div>
        <div class="field-grid-3">
          <div class="field-group">
            <label class="field-label" for="s-city">City</label>
            <input class="field-input" type="text" id="s-city" placeholder="Karachi" autocomplete="address-level2" />
          </div>
          <div class="field-group">
            <label class="field-label" for="s-state">State / Province</label>
            <input class="field-input" type="text" id="s-state" placeholder="Sindh" />
          </div>
          <div class="field-group">
            <label class="field-label" for="s-zip">Postal Code</label>
            <input class="field-input" type="text" id="s-zip" placeholder="75100" autocomplete="postal-code" />
          </div>
        </div>
      </div>

      <!-- Payment Method -->
      <div class="checkout-panel">
        <h2 class="checkout-heading">Payment Method</h2>

        <div class="pay-methods" id="pay-methods">
          <label class="pay-method selected" id="method-card">
            <input type="radio" name="pay-method" value="card" checked />
            <span class="pay-method-icon">💳</span>
            <span class="pay-method-label">Credit / Debit Card</span>
          </label>
          <label class="pay-method" id="method-paypal">
            <input type="radio" name="pay-method" value="paypal" />
            <span class="pay-method-icon">🅿️</span>
            <span class="pay-method-label">PayPal / Online Wallet</span>
          </label>
          <label class="pay-method" id="method-cod">
            <input type="radio" name="pay-method" value="cod" />
            <span class="pay-method-icon">💵</span>
            <span class="pay-method-label">Cash on Delivery</span>
          </label>
        </div>

        <!-- Card fields (shown only for card method) -->
        <div class="card-fields visible" id="card-fields">
          <div class="field-group">
            <label class="field-label" for="c-name">Name on Card</label>
            <input class="field-input" type="text" id="c-name" placeholder="Aisha Khan" autocomplete="cc-name" />
          </div>
          <div class="field-group">
            <label class="field-label" for="c-num">Card Number</label>
            <input class="field-input" type="text" id="c-num" placeholder="0000  0000  0000  0000" maxlength="19" autocomplete="cc-number" />
          </div>
          <div class="field-grid-2">
            <div class="field-group">
              <label class="field-label" for="c-exp">Expiry Date</label>
              <input class="field-input" type="text" id="c-exp" placeholder="MM / YY" maxlength="7" autocomplete="cc-exp" />
            </div>
            <div class="field-group">
              <label class="field-label" for="c-cvv">CVV</label>
              <input class="field-input" type="text" id="c-cvv" placeholder="123" maxlength="4" autocomplete="cc-csc" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── RIGHT: Order Summary ── -->
    <div>
      <div class="checkout-panel" style="position:sticky;top:88px;">
        <h2 class="checkout-heading">Order Summary</h2>

        <!-- Cart items injected by JS -->
        <div id="order-items"></div>

        <!-- Summary lines -->
        <div style="margin-top: 1rem;">
          <div class="order-summary-line"><span>Subtotal</span><span id="summary-subtotal">$0.00</span></div>
          <div class="order-summary-line"><span>Shipping</span><span id="summary-shipping">$5.00</span></div>
          <div class="order-summary-line" id="discount-row" style="display:none;color:var(--rose);">
            <span>Discount</span><span id="summary-discount">-$0.00</span>
          </div>
          <div class="order-total">
            <span>Total</span>
            <span id="summary-total">$0.00</span>
          </div>
        </div>

        <!-- Promo Code -->
        <div class="promo-row">
          <input type="text" id="promo-input" placeholder="Promo code…" />
          <button id="promo-btn">Apply</button>
        </div>

        <!-- Pay -->
        <button class="btn-pay" id="pay-btn">Complete Payment →</button>
        <p class="secure-note">🔒 SSL encrypted &amp; 100% secure</p>
      </div>
    </div>

  </div>
</main>

<!-- Footer -->
<div id="footer-mount"></div>

<!-- Success Overlay -->
<div class="success-overlay" id="success-overlay">
  <div class="success-card">
    <div class="success-icon">🎉</div>
    <h2>Order Placed!</h2>
    <p>Thank you for shopping with Najiha. Your beautiful pieces are on their way. You'll receive a confirmation email shortly.</p>
    <a href="Home.html" class="btn-primary" style="display:inline-flex;">Back to Shop</a>
  </div>
</div>

<!-- Scripts -->
<script src="model.js"></script>
<script src="activity.js"></script>
<script>
  /* ── Checkout Activity ────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {

    NajihaActivity.mountNav('payment');
    NajihaActivity.mountFooter();
    NajihaActivity.mountSocialFloat();

    /* ── Render cart items ── */
    const SHIPPING = 5.00;
    let discountAmt = 0;

    function renderSummary() {
      const cart      = NajihaModel.Cart.getAll();
      const itemsEl   = document.getElementById('order-items');
      const subEl     = document.getElementById('summary-subtotal');
      const totalEl   = document.getElementById('summary-total');
      const discRow   = document.getElementById('discount-row');
      const discEl    = document.getElementById('summary-discount');

      if (cart.length === 0) {
        itemsEl.innerHTML = `<p style="color:var(--gray-mid);font-size:14px;padding:1rem 0;">Your cart is empty. <a href="Home.html" style="color:var(--rose);">Shop now →</a></p>`;
      } else {
        itemsEl.innerHTML = cart.map(item => `
          <div class="order-item">
            <div>
              <div class="order-item-name">${item.name}</div>
              <div class="order-item-meta">Qty: ${item.qty || 1}</div>
            </div>
            <div class="order-item-price">${NajihaActivity.formatPrice(item.price * (item.qty || 1))}</div>
          </div>
        `).join('');
      }

      const subtotal = NajihaModel.Cart.total();
      const total    = subtotal + SHIPPING - discountAmt;
      subEl.textContent   = NajihaActivity.formatPrice(subtotal);
      totalEl.textContent = NajihaActivity.formatPrice(Math.max(0, total));

      if (discountAmt > 0) {
        discRow.style.display = 'flex';
        discEl.textContent = `-${NajihaActivity.formatPrice(discountAmt)}`;
      }
    }

    renderSummary();

    /* ── Payment method toggle ── */
    document.querySelectorAll('[name="pay-method"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.querySelectorAll('.pay-method').forEach(el => el.classList.remove('selected'));
        radio.closest('.pay-method')?.classList.add('selected');
        document.getElementById('card-fields')?.classList.toggle('visible', radio.value === 'card');
      });
    });

    /* ── Card number formatting ── */
    document.getElementById('c-num')?.addEventListener('input', e => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 16);
      e.target.value = v.replace(/(.{4})/g, '$1  ').trim();
    });
    document.getElementById('c-exp')?.addEventListener('input', e => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (v.length >= 2) v = v.slice(0,2) + ' / ' + v.slice(2);
      e.target.value = v;
    });

    /* ── Promo code ── */
    const PROMOS = { 'NAJIHA10': 10, 'BABY20': 20 };
    document.getElementById('promo-btn')?.addEventListener('click', () => {
      const code = document.getElementById('promo-input')?.value.trim().toUpperCase();
      if (PROMOS[code]) {
        discountAmt = PROMOS[code];
        NajihaActivity.showToast(`✅ Promo applied! $${discountAmt} off your order.`);
        renderSummary();
      } else {
        NajihaActivity.showToast('❌ Invalid promo code.');
      }
    });

    /* ── Payment submit ── */
    document.getElementById('pay-btn')?.addEventListener('click', () => {
      const cart = NajihaModel.Cart.getAll();
      if (cart.length === 0) {
        NajihaActivity.showToast('Your cart is empty!');
        return;
      }
      const btn = document.getElementById('pay-btn');
      btn.textContent = 'Processing…';
      btn.disabled = true;

      setTimeout(() => {
        NajihaModel.Cart.clear();
        document.getElementById('success-overlay')?.classList.add('open');
        btn.textContent = 'Complete Payment →';
        btn.disabled = false;
      }, 1600);
    });
  });
</script>

</body>
</html>
