<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Auth | 2026 Edition</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.18);
            --accent-color: #7c3aed; /* Modern Purple */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #4c1d95 100%);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 1100px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            min-height: 700px;
        }

        /* Left Side: Visual */
        .auth-visual {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1635776062127-d379bfcba9f8?q=80&w=2564&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            position: relative;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .auth-visual::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0) 100%);
        }

        /* Right Side: Forms */
        .auth-content {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }

        h2 { font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.6); margin-bottom: 30px; font-size: 0.95rem; }

        .form-label { font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.8); }

        .input-group {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            transition: 0.3s;
        }

        .input-group:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.2);
        }

        .form-control {
            background: transparent !important;
            border: none;
            color: #fff !important;
            padding: 12px;
        }

        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .input-group-text { background: transparent; border: none; color: rgba(255,255,255,0.4); }

        .btn-primary {
            background: var(--accent-color);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        /* Social Buttons */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider:not(:empty)::before { margin-right: 1em; }
        .divider:not(:empty)::after { margin-left: 1em; }

        .btn-social {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            padding: 10px;
            font-size: 0.85rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-social:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

        /* Animation */
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 992px) {
            .auth-visual { display: none; }
            .auth-card { max-width: 500px; min-height: auto; }
            .auth-content { padding: 40px 25px; }
        }
    </style>
</head>
<body>

<div class="auth-card">
    <!-- Visual Section -->
    <div class="auth-visual">
        <div style="position: relative; z-index: 2;">
            <h1 class="fw-bold">Level Up Your Experience.</h1>
            <p class="opacity-75">The most advanced sports dashboard of 2026.</p>
        </div>
    </div>

    <!-- Content Section -->
    <div class="auth-content">
        
        <!-- LOGIN SECTION -->
        <div id="loginBlock" class="fade-in">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details to sign in.</p>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" placeholder="name@domain.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="d-flex justify-content-between mb-4">
                    <div class="form-check small"><input type="checkbox" class="form-check-input" id="rem"> <label for="rem">Remember</label></div>
                    <a href="#" class="small text-white-50 text-decoration-none">Forgot?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
            </form>
            <p class="text-center small text-white-50">Don't have an account? <a href="#" onclick="toggleAuth()" class="text-white fw-bold text-decoration-none">Create Account</a></p>
        </div>

        <!-- SIGN UP SECTION (Hidden) -->
        <div id="signupBlock" class="fade-in" style="display: none;">
            <h2>Get Started</h2>
            <p class="subtitle">Join the future of sports management today.</p>
            
            <form id="signupForm">
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">First Name</label>
                        <div class="input-group"><input type="text" class="form-control" placeholder="John"></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Last Name</label>
                        <div class="input-group"><input type="text" class="form-control" placeholder="Doe"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" placeholder="name@domain.com">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Create password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
            </form>
            <p class="text-center small text-white-50">Already a member? <a href="#" onclick="toggleAuth()" class="text-white fw-bold text-decoration-none">Sign In</a></p>
        </div>

        <!-- Shared Social Login -->
        <div class="divider">or continue with</div>
        <div class="row g-2">
            <div class="col-12"><button onclick="socialLogin('Google')" class="btn btn-social w-100"><i class="bi bi-google text-danger"></i> Google</button></div>
            <div class="col-6"><button onclick="socialLogin('Apple')" class="btn btn-social w-100"><i class="bi bi-apple"></i> Apple</button></div>
            <div class="col-6"><button onclick="socialLogin('Facebook')" class="btn btn-social w-100"><i class="bi bi-facebook text-primary"></i> Facebook</button></div>
        </div>
    </div>
</div>

<script>
    // Toggle between Login and Signup
    function toggleAuth() {
        const login = document.getElementById('loginBlock');
        const signup = document.getElementById('signupBlock');
        
        if(login.style.display === "none") {
            login.style.display = "block";
            signup.style.display = "none";
        } else {
            login.style.display = "none";
            signup.style.display = "block";
        }
    }

    // Handle Social Clicks
    function socialLogin(provider) {
        alert("Redirecting to " + provider + " Secure Login...");
        // Here you would trigger the OAuth redirect
        setTimeout(() => {
            window.location.href = "#account-activated";
        }, 1000);
    }

    // Form Submissions
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Logging in...');
    });

    document.getElementById('signupForm').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Account Created Successfully!');
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
