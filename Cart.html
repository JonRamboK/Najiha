<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Najiha — Your Cart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="najiha.css" />

  <style>
    .cart-page { padding-top: 88px; min-height: 70vh; background: var(--cream); }
    .cart-container {
      max-width: 1060px; margin: 0 auto;
      padding: 40px 5% 80px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2.5rem;
      align-items: start;
    }
    .cart-heading { font-family: var(--font-display); font-size: 30px; margin-bottom: 1.5rem; }

    .cart-empty {
      background: var(--white); border-radius: var(--r-lg);
      padding: 4rem 2rem; text-align: center; box-shadow: var(--shadow-sm);
    }
    .cart-empty .ic { font-size: 46px; margin-bottom: 1rem; }
    .cart-empty p { color: var(--gray-mid); margin-bottom: 1.5rem; }

    .cart-line {
      display: grid;
      grid-template-columns: 84px 1fr auto;
      gap: 1rem;
      align-items: center;
      background: var(--white);
      border-radius: var(--r-lg);
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .cart-line img { width: 84px; height: 100px; object-fit: cover; border-radius: var(--r-md); background: var(--mist); }
    .cart-line-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
    .cart-line-brand { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--rose); margin-bottom: 6px; }
    .cart-line-price { font-size: 13px; color: var(--gray-mid); }

    .qty-control {
      display: flex; align-items: center; gap: 8px;
      border: 1.5px solid var(--border); border-radius: var(--r-pill);
      padding: 4px 6px; width: fit-content; margin-top: 8px;
    }
    .qty-control button {
      width: 24px; height: 24px; border-radius: 50%; border: none;
      background: var(--mist); color: var(--ink); font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-control button:hover { background: var(--rose); color: var(--white); }
    .qty-control span { font-size: 13px; min-width: 16px; text-align: center; }

    .cart-line-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .cart-line-total { font-size: 15px; font-weight: 700; color: var(--ink); }
    .cart-remove { background: none; border: none; color: var(--gray-mid); font-size: 12px; cursor: pointer; }
    .cart-remove:hover { color: var(--rose); }

    .cart-summary { background: var(--white); border-radius: var(--r-lg); padding: 1.75rem; box-shadow: var(--shadow-sm); position: sticky; top: 88px; }
    .cart-summary h3 { font-family: var(--font-display); font-size: 20px; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .summary-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--gray-mid); padding: 7px 0; }
    .summary-total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; color: var(--ink); border-top: 1.5px solid var(--border); margin-top: 8px; padding-top: 14px; }

    @media (max-width: 860px) {
      .cart-container { grid-template-columns: 1fr; }
      .cart-summary { position: static; }
    }
    @media (max-width: 480px) {
      .cart-line { grid-template-columns: 60px 1fr; }
      .cart-line-right { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

  <div id="nav-mount"></div>

  <main class="cart-page">
    <div style="max-width:1060px;margin:0 auto;padding:40px 5% 0;">
      <h1 class="cart-heading">Your Shopping Cart</h1>
    </div>
    <div class="cart-container">
      <div id="cart-items"></div>
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-line"><span>Subtotal</span><span id="cs-subtotal">$0.00</span></div>
        <div class="summary-line"><span>Shipping</span><span id="cs-shipping">$5.00</span></div>
        <div class="summary-total"><span>Total</span><span id="cs-total">$0.00</span></div>
        <button class="btn-primary" id="checkout-btn" style="width:100%;justify-content:center;margin-top:1.25rem;">Proceed to Checkout →</button>
        <a href="Store.html" style="display:block;text-align:center;font-size:13px;color:var(--rose);margin-top:1rem;">← Continue Shopping</a>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="model.js"></script>
  <script src="activity.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      NajihaActivity.mountNav('Cart');
      NajihaActivity.mountFooter();
      NajihaActivity.mountSocialFloat();

      const SHIPPING = 5.00;
      const itemsEl = document.getElementById('cart-items');

      function render() {
        const cart = NajihaModel.Cart.getAll();

        if (cart.length === 0) {
          itemsEl.innerHTML = `
            <div class="cart-empty">
              <div class="ic">🛍️</div>
              <p>Your cart is feeling a little empty.</p>
              <a href="Store.html" class="btn-primary">Start Shopping</a>
            </div>`;
        } else {
          itemsEl.innerHTML = cart.map(item => `
            <div class="cart-line" data-id="${item.id}">
              <img src="${item.img}" alt="${item.name}" onerror="this.style.opacity='0';" />
              <div>
                <div class="cart-line-brand">${item.brand}</div>
                <div class="cart-line-name">${item.name}</div>
                <div class="cart-line-price">${NajihaActivity.formatPrice(item.price)} each</div>
                <div class="qty-control">
                  <button data-dec="${item.id}">−</button>
                  <span>${item.qty || 1}</span>
                  <button data-inc="${item.id}">+</button>
                </div>
              </div>
              <div class="cart-line-right">
                <div class="cart-line-total">${NajihaActivity.formatPrice(item.price * (item.qty || 1))}</div>
                <button class="cart-remove" data-remove="${item.id}">Remove</button>
              </div>
            </div>
          `).join('');
        }

        const subtotal = NajihaModel.Cart.total();
        const shipping = cart.length ? SHIPPING : 0;
        document.getElementById('cs-subtotal').textContent = NajihaActivity.formatPrice(subtotal);
        document.getElementById('cs-shipping').textContent = NajihaActivity.formatPrice(shipping);
        document.getElementById('cs-total').textContent = NajihaActivity.formatPrice(subtotal + shipping);

        wireLines();
      }

      function wireLines() {
        itemsEl.querySelectorAll('[data-inc]').forEach(btn =>
          btn.addEventListener('click', () => { NajihaModel.Cart.add(Number(btn.dataset.inc)); render(); }));

        itemsEl.querySelectorAll('[data-dec]').forEach(btn =>
          btn.addEventListener('click', () => {
            const id = Number(btn.dataset.dec);
            const item = NajihaModel.Cart.getAll().find(i => i.id === id);
            if (item && (item.qty || 1) <= 1) {
              NajihaModel.Cart.remove(id);
            } else {
              item.qty -= 1;
              // Persist manually since Model only exposes add/remove
              const all = NajihaModel.Cart.getAll().map(i => i.id === id ? { ...i, qty: i.qty } : i);
              localStorage.setItem('najiha_cart', JSON.stringify(all));
              document.dispatchEvent(new CustomEvent('cart:updated', { detail: { cart: all } }));
            }
            render();
          }));

        itemsEl.querySelectorAll('[data-remove]').forEach(btn =>
          btn.addEventListener('click', () => {
            NajihaModel.Cart.remove(Number(btn.dataset.remove));
            NajihaActivity.showToast('Item removed from cart');
            render();
          }));
      }

      document.getElementById('checkout-btn').addEventListener('click', () => {
        if (NajihaModel.Cart.getAll().length === 0) {
          NajihaActivity.showToast('Your cart is empty!');
          return;
        }
        window.location.href = 'payment.html';
      });

      render();
    });
  </script>

</body>
</html>
