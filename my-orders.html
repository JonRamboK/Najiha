<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Track your Najiha Closet orders.">
<title>My Orders | Najiha Closet</title>
<link rel="icon" href="assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/extra.css">
<style>
.orders-wrap { max-width: 900px; margin: 0 auto 60px; padding: 0 28px; }
.order-card { background: var(--white); border-radius: var(--radius-md); padding: 22px; box-shadow: var(--shadow-soft); margin-bottom: 16px; }
.order-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.order-card-head h4 { font-size: 14.5px; }
.order-card-head span { font-size: 12px; color: var(--muted); }
.order-item-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.order-item-row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
.order-item-row .name { font-size: 13px; font-weight: 700; }
.order-item-row .meta { font-size: 11.5px; color: var(--muted); }
.order-total-row { display: flex; justify-content: space-between; font-weight: 800; margin-top: 12px; padding-top: 12px; border-top: 1.5px solid var(--line); font-size: 14px; }
</style>
</head>
<body>

<script src="js/loader.js"></script>
<div id="site-navbar"></div>

<main id="main">
  <section class="section-tight">
    <div class="section-head" style="margin-bottom:6px;">
      <div>
        <span class="section-eyebrow">Order History</span>
        <h2>My orders</h2>
        <p>Track the status of everything you've ordered from Najiha Closet.</p>
      </div>
    </div>
  </section>

  <section class="orders-wrap" style="padding-top:10px;" id="ordersWrap">
    <div class="empty-state">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <h3>Loading your orders...</h3>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/firebase-core.js"></script>
<script type="module" src="js/cart.js"></script>
<script type="module" src="js/navbar.js"></script>
<script type="module" src="js/footer.js"></script>
<script type="module">
import { hideLoadScreen, initFloatingButtons, initRevealOnScroll } from './js/ui.js';
import { onAuthReady, db, collection, query, where, onSnapshot } from './js/firebase-core.js';

hideLoadScreen();
initFloatingButtons();
initRevealOnScroll();

const wrap = document.getElementById('ordersWrap');
const STATUS_LABEL = { pending: 'Pending', confirmed: 'Confirmed', active: 'Confirmed', cancelled: 'Cancelled' };

function formatDate(ts) {
  try {
    const d = ts?.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return ''; }
}

function renderOrders(orders) {
  if (!orders.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-bag-shopping"></i>
        <h3>No orders yet</h3>
        <p>When you place an order, it will show up here.</p>
        <a href="shop.html" class="btn btn-primary">Start shopping</a>
      </div>`;
    return;
  }
  wrap.innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-card-head">
        <div><h4>Order #${o.id.slice(0, 8).toUpperCase()}</h4><span>${formatDate(o.createdAt)}</span></div>
        <span class="status-pill ${o.status || 'pending'}">${STATUS_LABEL[o.status] || 'Pending'}</span>
      </div>
      ${(o.items || []).map(i => `
        <div class="order-item-row">
          <img src="${i.image}" alt="${i.name}">
          <div>
            <div class="name">${i.name}</div>
            <div class="meta">Size ${i.size || '-'} · Qty ${i.qty}</div>
          </div>
        </div>`).join('')}
      <div class="order-total-row"><span>Total</span><span>Rs. ${Number(o.total || 0).toLocaleString('en-PK')}</span></div>
    </div>`).join('');
}

onAuthReady((user) => {
  if (!user) {
    wrap.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-user-lock"></i>
        <h3>Please sign in</h3>
        <p>Login to view your order history.</p>
        <a href="login.html?next=my-orders.html" class="btn btn-primary">Login</a>
      </div>`;
    return;
  }
  // Sorted client-side (newest first) so this never needs a Firestore
  // composite index — a plain "where" query works out of the box.
  const q = query(collection(db, 'orders'), where('uid', '==', user.uid));
  onSnapshot(q, (snap) => {
    const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    orders.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    renderOrders(orders);
  }, (err) => {
    console.error(err);
    wrap.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-circle-exclamation"></i>
        <h3>Couldn't load orders</h3>
        <p>Please check your connection and try again.</p>
      </div>`;
  });
});
</script>
</body>
</html>
