<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Shop premium baby, girls and boys clothing at Najiha Closet — 100+ styles with custom sizing available.">
<title>Shop | Najiha Closet</title>
<link rel="icon" href="assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/extra.css">
</head>
<body>

<script src="js/loader.js"></script>
<div id="site-navbar"></div>

<main id="main">
  <section class="section-tight">
    <div class="section-head" style="margin-bottom:6px;">
      <div>
        <span class="section-eyebrow">Full Collection</span>
        <h2>Shop the collection</h2>
        <p>100+ handpicked essentials, sets and occasion wear for every stage — filter by category, age, size and price.</p>
      </div>
      <span class="result-count" id="resultCount"></span>
    </div>
  </section>

  <section class="section" style="padding-top:20px;">
    <div class="shop-layout">
      <aside class="shop-sidebar">
        <div class="filter-group">
          <h4>Search</h4>
          <input type="text" class="search-input" id="shopSearchInput" placeholder="Search products..." style="width:100%;">
        </div>
        <div class="filter-group">
          <h4>Occasion</h4>
          <div id="occasionFilters"></div>
        </div>
        <div class="filter-group">
          <h4>Age</h4>
          <select id="ageFilters" class="sort-select" style="width:100%;"></select>
        </div>
        <div class="filter-group">
          <h4>Size</h4>
          <select id="sizeFilters" class="sort-select" style="width:100%;"></select>
        </div>
        <div class="filter-group">
          <h4>Price (Rs.)</h4>
          <div class="range-row">
            <input type="number" id="minPriceInput" placeholder="Min">
            <input type="number" id="maxPriceInput" placeholder="Max">
          </div>
          <button class="btn btn-outline btn-sm" id="applyPriceBtn" style="margin-top:10px;width:100%;justify-content:center;">Apply</button>
        </div>
        <div class="filter-group">
          <label class="filter-check"><input type="checkbox" id="customOnlyFilter"> Custom size available only</label>
        </div>
        <button class="btn btn-outline btn-sm" id="clearFiltersBtn" style="width:100%;justify-content:center;">Clear all filters</button>
      </aside>

      <div>
        <div class="filter-bar">
          <div class="filter-pills" id="filterPills"></div>
          <select class="sort-select" id="sortSelect">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="load-more-wrap">
          <button class="btn btn-outline" id="loadMoreBtn" style="display:none;">Load more products</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/firebase-core.js"></script>
<script type="module" src="js/cart.js"></script>
<script type="module" src="js/navbar.js"></script>
<script type="module" src="js/footer.js"></script>
<script type="module" src="js/shop.js"></script>
</body>
</html>
