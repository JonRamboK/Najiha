<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Najiha — Create Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="najiha.css" />

  <style>
    body { background: var(--cream); min-height: 100vh; }
    .auth-wrap { min-height: 100vh; display: flex; }

    .auth-visual {
      flex: 1;
      position: relative;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 3rem;
      overflow: hidden;
      background: linear-gradient(135deg, #1c1c1e 40%, #2d1a2e);
    }
    .auth-visual::before {
      content: ''; position: absolute; inset: 0;
      background: url('./baby_frock_hinger.jpg') center/cover no-repeat;
      opacity: 0.25;
    }
    .auth-visual-content { position: relative; z-index: 1; }
    .auth-visual h1 { font-family: var(--font-display); font-size: clamp(32px,3.5vw,52px); color: var(--white); line-height: 1.15; margin-bottom: 12px; }
    .auth-visual h1 em { color: var(--rose); font-style: normal; }
    .auth-visual p { color: rgba(255,255,255,0.6); font-size: 15px; line-height: 1.7; max-width: 400px; }
    .auth-deco { position: absolute; top: 15%; right: -80px; width: 360px; height: 360px; border-radius: 50%; background: rgba(232,100,122,0.08); border: 1px solid rgba(232,100,122,0.15); }

    .auth-form-panel {
      width: 480px; flex-shrink: 0;
      background: var(--white);
      display: flex; flex-direction: column; justify-content: center;
      padding: 20px 52px;
    }
    .auth-logo { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--ink); margin-bottom: 40px; display: block; }
    .auth-logo em { color: var(--rose); font-style: normal; }
    .auth-title { font-family: var(--font-display); font-size: 30px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .auth-subtitle { font-size: 14px; color: var(--gray-mid); margin-bottom: 32px; }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 13px 16px; background: var(--cream);
      border: 1.5px solid var(--border); border-radius: var(--r-md);
      font-size: 14px; font-family: var(--font-body); color: var(--ink);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(232,100,122,0.12); }
    .form-input::placeholder { color: var(--gray-mid); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-hint { font-size: 11px; color: var(--gray-mid); margin-top: 5px; }

    .input-wrap { position: relative; }
    .input-wrap .form-input { padding-right: 44px; }
    .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray-mid); cursor: pointer; font-size: 15px; padding: 4px; }
    .pw-toggle:hover { color: var(--rose); }

    .btn-auth {
      width: 100%; padding: 14px; background: var(--rose); color: var(--white);
      border: none; border-radius: var(--r-pill); font-size: 15px; font-weight: 600;
      font-family: var(--font-body); cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative; overflow: hidden;
    }
    .btn-auth:hover { background: var(--rose-dark); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,100,122,0.3); }
    .btn-auth:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .btn-auth .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-auth.loading .btn-text { display: none; }
    .btn-auth.loading .spinner  { display: block; }

    .switch-text { font-size: 14px; color: var(--gray-mid); text-align: center; margin-top: 28px; }
    .switch-link { color: var(--rose); font-weight: 600; }
    .switch-link:hover { text-decoration: underline; }

    .form-feedback { display: none; padding: 12px 16px; border-radius: var(--r-md); font-size: 13px; margin-bottom: 18px; }
    .form-feedback.error   { background: #fee2e8; color: #c0132e; border: 1px solid #fca5b5; }
    .form-feedback.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .form-feedback.visible { display: block; animation: fade-up 0.25s var(--ease); }

    @media (max-width: 900px) {
      .auth-visual { display: none; }
      .auth-form-panel { width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div class="auth-deco"></div>
    <div class="auth-visual-content fade-up">
      <h1>Join the <em>Najiha</em> family.</h1>
      <p>Create an account to save your favorites, track orders, and get early access to new arrivals.</p>
    </div>
  </div>

  <div class="auth-form-panel">
    <a href="Home.html" class="auth-logo">Na<em>jiha</em></a>

    <div class="form-feedback" id="auth-feedback"></div>

    <h2 class="auth-title">Create account</h2>
    <p class="auth-subtitle">Join the Najiha family today.</p>

    <form id="register-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="r-fname">First Name</label>
          <input class="form-input" type="text" id="r-fname" placeholder="Aisha" required autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="r-lname">Last Name</label>
          <input class="form-input" type="text" id="r-lname" placeholder="Khan" autocomplete="family-name" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="r-email">Email</label>
        <input class="form-input" type="email" id="r-email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="r-pw">Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="r-pw" placeholder="Create a strong password" required autocomplete="new-password" />
          <button type="button" class="pw-toggle" data-target="r-pw">👁</button>
        </div>
        <p class="form-hint">Min. 8 characters with at least one uppercase letter and one number.</p>
      </div>
      <button type="submit" class="btn-auth" id="register-btn">
        <span class="btn-text">Create Account</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="switch-text">Already a member? <a class="switch-link" href="Login.html">Sign in</a></p>
  </div>
</div>

<script src="model.js"></script>
<script>
  (() => {
    if (NajihaModel.Auth.currentUser()) { window.location.href = 'Home.html'; }

    const feedback = document.getElementById('auth-feedback');
    const regForm  = document.getElementById('register-form');

    function showFeedback(msg, type = 'error') {
      feedback.textContent = msg;
      feedback.className = `form-feedback ${type} visible`;
      setTimeout(() => feedback.classList.remove('visible'), 4000);
    }
    function setLoading(btn, on) { btn.classList.toggle('loading', on); btn.disabled = on; }

    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.textContent = input.type === 'password' ? '👁' : '🙈';
      });
    });

    regForm.addEventListener('submit', e => {
      e.preventDefault();
      const fname    = document.getElementById('r-fname').value.trim();
      const lname    = document.getElementById('r-lname').value.trim();
      const email    = document.getElementById('r-email').value.trim();
      const password = document.getElementById('r-pw').value;
      const btn      = document.getElementById('register-btn');
      const name     = [fname, lname].filter(Boolean).join(' ');

      setLoading(btn, true);
      setTimeout(() => {
        const result = NajihaModel.Auth.register({ name, email, password });
        setLoading(btn, false);
        if (result.ok) {
          showFeedback('Account created! Redirecting to sign in…', 'success');
          setTimeout(() => { window.location.href = 'Login.html'; }, 1500);
        } else {
          showFeedback(result.msg, 'error');
        }
      }, 900);
    });
  })();
</script>

</body>
</html>
